name: Fix assisted pull-up progression

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-assisted-pullup-progression.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch inverse-load progression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          replacements = [
              (
                  """const wOf=ex=>DB.next[ex.id]!=null?DB.next[ex.id]:ex.w;
          const lastOf=id=>{for(let i=DB.history.length-1;i>=0;i--){const e=DB.history[i].entries[id];
            if(e)return{...e,date:DB.history[i].date}}return null};""",
                  """const lastOf=id=>{for(let i=DB.history.length-1;i>=0;i--){const e=DB.history[i].entries[id];
            if(e)return{...e,date:DB.history[i].date}}return null};
          const INVERSE_LOAD_IDS=new Set(['alt_assist_pullup','alt_assist_pullup2']);
          const inverseLoad=ex=>!!(ex&&INVERSE_LOAD_IDS.has(ex.id));
          const progressedWeight=(ex,w)=>inverseLoad(ex)?Math.max(0,w-ex.inc):w+ex.inc;
          const wOf=ex=>{
            const next=DB.next[ex.id];
            /* Repair an already-saved target produced by the old assisted-pull-up bug. */
            if(inverseLoad(ex)&&next!=null&&ex.inc){
              const l=lastOf(ex.id);
              if(l&&next===l.w+ex.inc){
                DB.next[ex.id]=Math.max(0,l.w-ex.inc);
                return DB.next[ex.id];
              }
            }
            return next!=null?next:ex.w;
          };"""
              ),
              (
                  """(held?'':(hit?`<span class=\"pill up\">↑ now ${wOf(ex)} lb</span>`""",
                  """(held?'':(hit?`<span class=\"pill up\">${inverseLoad(ex)?'↓':'↑'} now ${wOf(ex)} lb</span>`"""
              ),
              (
                  """DB.next[id]=(hit&&ex.inc&&!held)?e.w+ex.inc:e.w;    // applied ONCE, here""",
                  """DB.next[id]=(hit&&ex.inc&&!held)?progressedWeight(ex,e.w):e.w;    // applied ONCE, here"""
              ),
              (
                  """earned a heavier target next time.""",
                  """earned progression next time."""
              ),
              (
                  """moved up`:'Session closed'""",
                  """progressed`:'Session closed'"""
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Verify patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          checks = [
              "const INVERSE_LOAD_IDS=new Set(['alt_assist_pullup','alt_assist_pullup2']);",
              "const progressedWeight=(ex,w)=>inverseLoad(ex)?Math.max(0,w-ex.inc):w+ex.inc;",
              "DB.next[id]=(hit&&ex.inc&&!held)?progressedWeight(ex,e.w):e.w;",
              "${inverseLoad(ex)?'↓':'↑'} now ${wOf(ex)} lb",
              "earned progression next time.",
              "progressed`:'Session closed'",
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit('Patch verification failed: ' + repr(missing))
          print('Assisted pull-up progression patch verified.')
          PY

      - name: Publish fix to main
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix assisted pull-up inverse progression'
          git push origin main
