name: Fix assisted pull-up progression

on:
  push:
    paths:
      - '.github/workflows/fix-assisted-pullup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch inverse progression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text()

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'Expected source pattern not found: {old[:100]}')
              s = s.replace(old, new, 1)

          replace_once(
              '{id:"alt_assist_pullup",n:"Assisted pull-up machine",frac:.30,inc:5}',
              '{id:"alt_assist_pullup",n:"Assisted pull-up machine",frac:.30,inc:5,inverse:1}'
          )
          replace_once(
              '{id:"alt_assist_pullup2",n:"Assisted pull-up machine",frac:.30,inc:5}',
              '{id:"alt_assist_pullup2",n:"Assisted pull-up machine",frac:.30,inc:5,inverse:1}'
          )
          replace_once(
              'const wOf=ex=>DB.next[ex.id]!=null?DB.next[ex.id]:ex.w;',
              '''const wOf=ex=>{
  const next=DB.next[ex.id]!=null?DB.next[ex.id]:ex.w;
  if(!ex.inverse)return next;
  const l=lastOf(ex.id); if(!l)return next;
  const hit=l.reps.length>=3&&l.reps.every(r=>r>=ex.r);
  return (hit&&next>l.w)?Math.max(0,l.w-ex.inc):next;
};'''
          )
          replace_once(
              'DB.next[id]=(hit&&ex.inc&&!held)?e.w+ex.inc:e.w;    // applied ONCE, here',
              'DB.next[id]=(hit&&ex.inc&&!held)?Math.max(0,e.w+(ex.inverse?-ex.inc:ex.inc)):e.w;    // applied ONCE, here'
          )
          replace_once(
              '`<span class="pill up">↑ now ${wOf(ex)} lb</span>`',
              '`<span class="pill up">${ex.inverse?\'↓\':\'↑\'} now ${wOf(ex)} lb</span>`'
          )
          replace_once('earned a heavier target next time.', 'earned a harder target next time.')
          replace_once("moved up`:'Session closed'", "progressed`:'Session closed'")

          path.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix assisted pull-up inverse progression"
          git push
