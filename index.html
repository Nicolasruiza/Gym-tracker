<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0d0c">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0F1518;--card:#1A2328;--card2:#222D33;--bone:#EDE8DD;--muted:#8B9BA3;
    --pine:#43A177;--brass:#D4A94F;--red:#F08A80;--rule:#2C383E;--pink:#e58fb0;
    --accent:#43A177;--accentText:#08130E;--accentDim:#1A342D;--accentBright:#7FBE9C;
    --accentBorder:#28483C;--accentGradA:#182A26;--accentGlow:rgba(67,161,119,.2)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--ink);color:var(--bone);font-family:"IBM Plex Sans",system-ui,sans-serif;padding-bottom:80px}
  .wrap{max-width:600px;margin:0 auto;padding:0 12px}

  .profilebar{position:relative;display:flex;flex-direction:column;align-items:center;
    padding-top:14px;gap:3px}
  .avatar{width:46px;height:46px;min-width:44px;min-height:44px;border-radius:50%;border:none;cursor:pointer;
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;
    display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--accentText)}
  .pname{font-family:"Barlow Condensed",sans-serif;font-size:14px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted)}
  .cycleday{font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted);letter-spacing:.08em;min-height:12px}
  .switcher{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:20;
    background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:6px;
    display:flex;flex-direction:column;gap:5px;box-shadow:0 6px 18px rgba(0,0,0,.4);min-width:190px}
  .switcher[hidden]{display:none}
  .swopt{min-height:44px;border:none;border-radius:8px;background:var(--card2);color:var(--bone);
    font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:.05em;
    cursor:pointer;padding:8px 12px;display:flex;align-items:center;gap:9px;text-align:left}
  .swopt .ini{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:flex;
    align-items:center;justify-content:center;font-size:11px;color:#0B0F11}
  .swopt.active{outline:2px solid var(--accent)}
  .swadd{min-height:44px;border:1px dashed var(--rule);border-radius:8px;background:transparent;
    color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;cursor:pointer}

  .lowe{display:block;width:100%;margin-top:9px;min-height:44px;padding:11px;border-radius:8px;
    border:1px solid var(--pink);background:transparent;color:var(--pink);
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;cursor:pointer}
  .lowe.on{background:var(--pink);color:#2A0F1B}
  .cyclebtn{display:block;width:100%;margin-top:9px;min-height:44px;padding:9px;border-radius:8px;
    border:1px solid var(--rule);background:transparent;color:var(--muted);
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;cursor:pointer}

  /* week strip */
  .week{position:sticky;top:0;z-index:10;background:var(--ink);padding:12px 0 6px;display:flex;gap:6px}
  .wd{flex:1;min-height:52px;padding:7px 1px;border:none;border-radius:8px;cursor:pointer;
    background:var(--card);color:var(--muted);font-family:"Barlow Condensed",sans-serif;
    font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
  .wd small{display:block;font-family:"IBM Plex Mono",monospace;font-size:7.5px;
    letter-spacing:.06em;opacity:.75;margin-top:3px}
  .wd.on{background:var(--accent);color:var(--accentText)}
  .wd.today:not(.on){box-shadow:inset 0 0 0 1.5px var(--accent)}
  .wd.rest{opacity:.5}
  .wd.done small::after{content:" \2713";opacity:1}
  .histbtn{width:100%;min-height:44px;margin-bottom:8px;border:1px solid var(--rule);border-radius:9px;
    background:transparent;color:var(--muted);font-family:"IBM Plex Mono",monospace;
    font-size:10px;letter-spacing:.14em;cursor:pointer}
  .histbtn.on{background:var(--accentDim);color:var(--accent);border-color:var(--accent)}

    background:transparent;color:var(--muted);font-family:"IBM Plex Mono",monospace;
    font-size:9.5px;letter-spacing:.07em;cursor:pointer}

    font-size:12.5px;line-height:1.55;color:var(--muted)}
  .z2 b{color:var(--bone)}

  /* setup */
  .setup{background:var(--card);border-radius:12px;padding:14px;margin:6px 0 16px;border:1px solid var(--rule)}
  .pf{border-bottom:1px solid var(--rule);padding:11px 0}
  .pf:last-of-type{border-bottom:none}
  .pfg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
  .pfg label{font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.1em;
    color:var(--muted);display:block;margin-bottom:3px}
  .pfg input,.pfg select{width:100%;height:44px;padding:6px 8px;border-radius:8px;border:1px solid var(--rule);
    background:#131B1F;color:var(--bone);font-family:"IBM Plex Mono",monospace;font-size:13px;text-align:left}
  .pfg input[type=color]{padding:3px}
  .chkrow{display:flex;gap:14px;margin:8px 0;flex-wrap:wrap}
  .chkrow label{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);
    display:flex;align-items:center;gap:6px;min-height:44px;cursor:pointer}
  .chkrow input{width:20px;height:20px}

  /* alternates */
  .altbtn{flex:0 0 44px;height:44px;border-radius:9px;background:var(--card2);border:none;cursor:pointer;
    font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.05em;color:var(--muted)}
  .altbtn.on{background:var(--accentDim);color:var(--accent)}
  .altlist{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
  .altlist button{min-height:40px;border:1px solid var(--rule);border-radius:8px;background:transparent;
    color:var(--bone);font-family:"IBM Plex Sans",sans-serif;font-size:12px;padding:9px 10px;cursor:pointer}
  .altlist button.cur{border-color:var(--accent);color:var(--accent)}
  .swapped{background:#1D3548;color:#69AEE8;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
    padding:5px 9px;border-radius:99px;letter-spacing:.06em}
  .ex.inj{border-color:#7A4C48;background:linear-gradient(180deg,#2A1B1A,#1A2529)}

  /* focus + injury */
  .fsel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .fsel button{min-height:44px;padding:9px 11px;border:1px solid var(--rule);border-radius:8px;
    background:transparent;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:10px;
    letter-spacing:.07em;cursor:pointer}
  .fsel button.on{background:var(--accentDim);color:var(--accent);border-color:var(--accent)}
  .dx{background:var(--card2);border-radius:9px;padding:11px;margin-top:10px;
    font-size:12.5px;line-height:1.55;color:var(--muted)}
  .dx b{color:var(--bone)}
  .dxbar{height:7px;background:#131B1F;border-radius:99px;overflow:hidden;margin:8px 0 6px}
  .dxbar span{display:block;height:100%;background:var(--accent)}
  .cost{background:#2A1B1A;border:1px solid #7A4C48;border-radius:9px;padding:11px;margin-top:10px;
    font-size:12.5px;line-height:1.55;color:#E8C4BF}
  .cost b{color:var(--bone)}
  .nag{background:#3A2E22;border:1px solid var(--brass);border-radius:9px;padding:11px;margin-bottom:12px;
    font-size:12.5px;line-height:1.5;color:var(--brass)}
  .nag .ebtns{margin-top:9px}

  .mini{background:var(--card);color:var(--bone);border:1px solid #3c4744;border-radius:6px;
        font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;padding:6px 9px;cursor:pointer}
  .mini.del{border-color:#7a3b3b;color:#e0a0a0}
  .sesedit{padding:10px 0;border-bottom:1px solid #2a3330}
  .erow{display:grid;grid-template-columns:1fr 56px 44px 44px 44px;gap:5px;align-items:center;margin-bottom:6px}
  .erow.head{font-family:"IBM Plex Mono",monospace;font-size:9px;opacity:.6;letter-spacing:.1em}
  .erow .en{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ei{background:#101a17;border:1px solid #3c4744;border-radius:6px;color:var(--bone);
      padding:7px 4px;font-size:13px;text-align:center;width:100%;min-height:34px}
  .ei.date{grid-column:2/6;text-align:left;padding-left:8px}
  .ebtns{display:flex;gap:8px;margin-top:8px}
  .diag{margin-top:18px;padding:12px;border:1px dashed #4a5550;border-radius:8px;
        font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.7;opacity:.75}

  /* session control */
  .sess{background:var(--card);border-radius:12px;padding:15px;margin:6px 0 16px;border:1px solid var(--rule)}
  .sess.live{border-color:var(--accent);background:linear-gradient(180deg,var(--accentGradA),#1A2529)}
  .sess.rest{border-color:#4A3A25}
  .sess .st{display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 9px}
  .dot.go{background:var(--accent);box-shadow:0 0 0 4px var(--accentGlow)}
  .dot.no{background:var(--brass)}
  .sv{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.1em;
    padding:4px 8px;border-radius:99px;background:var(--card2);color:var(--muted)}
  .sv.ok{background:var(--accentDim);color:var(--accent)}
  .sv.bad{background:#4A2A27;color:var(--red)}
  .sess .st b{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase}
  .sess p{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:12px}
  .sess p b{color:var(--bone)}
  .big{width:100%;padding:16px;border:none;border-radius:10px;cursor:pointer;
    font-family:"Barlow Condensed",sans-serif;font-size:21px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accentText)}
  .big.stop{background:var(--brass);color:#1A1204}
  .big.off{background:var(--card2);color:var(--muted);cursor:not-allowed}
  .anyway{display:block;width:100%;margin-top:9px;background:none;border:none;color:var(--muted);
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-decoration:underline;cursor:pointer}
  .live-stats{display:flex;gap:16px;margin-bottom:12px}
  .live-stats div{font-family:"IBM Plex Mono",monospace}
  .live-stats b{display:block;font-size:21px;color:var(--accent)}
  .live-stats small{font-size:8.5px;letter-spacing:.12em;color:var(--muted)}

  .blk{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin:20px 0 8px;display:flex;align-items:center;gap:9px}
  .blk i{flex:1;height:1px;background:var(--rule)}

  .ex{background:var(--card);border-radius:11px;padding:13px;margin-bottom:9px;border:1px solid transparent}
  .ex.key{border-color:var(--accentBorder);background:linear-gradient(180deg,var(--accentGradA),#1A2529)}
  .ex.done{border-color:var(--accent)}
  .ex.idle{opacity:.5}
  .top{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .top h3{flex:1;font-size:15.5px;font-weight:600;line-height:1.25}
  .tgt{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;color:var(--brass);white-space:nowrap}
  .vid{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:center;
    border-radius:9px;background:var(--card2);text-decoration:none;border:none;cursor:pointer;padding:0}
  .vid svg{width:17px;height:17px;fill:var(--muted);pointer-events:none}
  .vid:active{background:#2E3B42}
  .vid:active svg{fill:var(--brass)}

  .hold{background:#4A2A27;color:var(--red);font-family:"IBM Plex Mono",monospace;font-size:10px;
    padding:5px 9px;border-radius:99px;letter-spacing:.06em}
  .release{background:none;border:1px solid var(--rule);color:var(--muted);border-radius:99px;
    font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;padding:5px 9px;cursor:pointer}
  .badge{font-family:"IBM Plex Mono",monospace;font-size:8.5px;font-weight:600;letter-spacing:.09em;
    padding:3px 7px;border-radius:99px;white-space:nowrap;margin-left:7px;vertical-align:1px}
  .b4{background:var(--accentDim);color:var(--accentBright)}.b3{background:#1D3548;color:#69AEE8}
  .b2{background:#3E3320;color:#E5BB5C}.b1{background:#4A2A27;color:var(--red)}
  .b0{background:#252F35;color:#7C8A91}

  .row{display:flex;gap:6px;align-items:center}
  .fld{flex:0 0 88px;position:relative}
  .fld.grow{flex:1}
  .fld label{position:absolute;top:5px;left:8px;font-family:"IBM Plex Mono",monospace;
    font-size:8px;letter-spacing:.11em;color:var(--muted);pointer-events:none}
  input{width:100%;height:52px;padding:14px 6px 4px;border-radius:8px;border:1px solid var(--rule);
    background:#131B1F;color:var(--bone);font-family:"IBM Plex Mono",monospace;font-size:18px;
    font-weight:600;text-align:center;-moz-appearance:textfield}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input:focus{outline:none;border-color:var(--accent)}
  input:disabled{opacity:.45}
  input.hit{border-color:var(--accent);color:var(--accent)}
  input.miss{border-color:#7A4C48}

  .log{flex:0 0 56px;height:52px;border:none;border-radius:8px;background:var(--accent);color:var(--accentText);
    font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;cursor:pointer}
  .log.saved{background:var(--accentDim);color:var(--accent);border:1px solid var(--accent)}
  .log.off{background:var(--card2);color:var(--muted);cursor:not-allowed}

  .plates{margin-top:9px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
    color:var(--brass);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .plates .bar45{color:var(--muted)}
  .plates .pl{background:#3E3320;color:#E5BB5C;border-radius:4px;padding:2px 6px;font-weight:600}
  .plates .warn{color:var(--red)}
  .ft{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
  .pill{font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:5px 9px;border-radius:99px;
    background:var(--card2);color:var(--muted)}
  .pill.up{background:var(--accentDim);color:var(--accent)}
  .pill.hold{background:#3A2E22;color:var(--brass)}

  /* history */
  .hcard{background:var(--card);border-radius:11px;padding:13px;margin-bottom:9px}
  .hrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(44,56,62,.6)}
  .hrow:last-child{border-bottom:none}
  .hrow .nm{flex:1;font-size:14px}
  .track{flex:0 0 96px;height:6px;background:#131B1F;border-radius:99px;overflow:hidden}
  .track span{display:block;height:100%;background:var(--accent)}
  .delta{font-family:"IBM Plex Mono",monospace;font-size:13px;white-space:nowrap}
  .delta b{color:var(--accent)}
  .sesrow{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid rgba(44,56,62,.6);
    font-family:"IBM Plex Mono",monospace;font-size:12.5px}
  .sesrow .d{color:var(--muted);flex:0 0 52px}
  .sesrow .t{flex:1;font-family:"IBM Plex Sans",sans-serif;font-size:13.5px}
  .sesrow .v{color:var(--brass)}
  .h2{font-family:"Barlow Condensed",sans-serif;font-size:22px;text-transform:uppercase;
    letter-spacing:.05em;margin:22px 0 10px;color:var(--bone)}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:26px 10px;line-height:1.6}

  .bar2{display:flex;gap:8px;margin-top:24px}
  .bar2 button{flex:1;min-height:44px;padding:12px 4px;border:1px solid var(--rule);background:transparent;color:var(--muted);
    border-radius:9px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;cursor:pointer}
  .toast{display:none;position:fixed;left:0;right:0;bottom:20px;margin:auto;width:calc(100% - 32px);max-width:420px;pointer-events:none;
    background:var(--accent);color:var(--accentText);padding:12px 18px;border-radius:99px;font-weight:600;
    font-size:13.5px;z-index:50;text-align:center}
  .toast.show{display:block}

  /* ================= 2026 VISUAL REVAMP ================= */
  :root{
    --ink:#0A0D0C;--card:#141816;--card2:#1B211E;--bone:#F3F1E8;--muted:#8F9B94;
    --pine:#B9F227;--brass:#FFB86B;--red:#FF746C;--rule:#29302C;--pink:#F39BC0;
    --accent:#B9F227;--accentText:#101607;--accentDim:#222D17;--accentBright:#D6FF6A;
    --accentBorder:#526923;--accentGradA:#1B2316;--accentGlow:rgba(185,242,39,.18)
  }
  html{scroll-behavior:smooth;background:var(--ink)}
  body{min-height:100vh;padding-bottom:112px;background:
    radial-gradient(circle at 50% -120px,rgba(185,242,39,.10),transparent 340px),
    linear-gradient(180deg,#0A0D0C 0%,#0D100F 100%);font-size:15px}
  button,input,select{font:inherit}
  button{transition:transform .16s ease,background-color .16s ease,border-color .16s ease,color .16s ease,opacity .16s ease}
  button:active{transform:scale(.975)}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .wrap{max-width:680px;padding:0 16px}

  .profilebar{padding:24px 0 20px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;
    column-gap:13px;align-items:center;text-align:left}
  .profilebar::before{content:"LIFT LOG / 3";grid-column:1/3;margin-bottom:19px;color:var(--bone);
    font-family:"Barlow Condensed",sans-serif;font-size:27px;font-weight:700;letter-spacing:.065em}
  .profilebar::after{content:"Progressive overload, without the spreadsheet.";position:absolute;right:0;top:31px;
    color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase}
  .avatar{grid-row:2/4;width:52px;height:52px;border-radius:15px;font-size:17px;box-shadow:0 10px 28px var(--accentGlow)}
  .pname{align-self:end;color:var(--bone);font-size:18px;line-height:1.05;letter-spacing:.045em}
  .cycleday{align-self:start;margin-top:5px;font-size:10px;color:var(--accent)}
  .switcher{top:105px;left:0;transform:none;min-width:min(320px,calc(100vw - 32px));padding:8px;border-radius:15px;
    box-shadow:0 18px 48px rgba(0,0,0,.55)}

  .week{top:0;margin:0 -16px;padding:10px 16px;background:rgba(10,13,12,.88);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.04)}
  .wd{min-height:62px;border-radius:12px;background:transparent;border:1px solid var(--rule);font-size:17px}
  .wd small{font-size:8px;margin-top:5px}.wd.on{border-color:var(--accent);box-shadow:0 8px 22px var(--accentGlow)}
  .wd.rest{opacity:.62}.wd.today:not(.on){box-shadow:inset 0 0 0 1px var(--accent)}
  .histbtn{margin:12px 0 10px;border-radius:12px;background:var(--card);border-color:transparent;text-align:left;
    padding:0 15px;position:relative;color:var(--bone)}
  .histbtn::after{content:"→";position:absolute;right:15px;color:var(--accent);font-size:16px}

  .sess,.setup,.ex,.hcard{border-radius:16px;border-color:var(--rule);box-shadow:0 14px 34px rgba(0,0,0,.16)}
  .sess{padding:18px;margin:10px 0 18px}.sess.live{box-shadow:0 16px 40px var(--accentGlow)}
  .sess .st b{font-size:12px}.sess p{font-size:14px}.big{min-height:58px;border-radius:12px;font-size:23px}
  .live-stats{padding:11px 0 3px}.live-stats b{font-size:25px}
  .blk{margin:26px 2px 10px;font-size:9px;color:#AAB4AE}
  .ex{position:relative;padding:16px;margin-bottom:11px}.ex.key{box-shadow:inset 3px 0 0 var(--accent)}
  .expand-hit{display:none}
  .top{margin-bottom:14px}.top h3{font-size:16px}.tgt{font-size:16px;color:var(--accent)}
  .vid,.altbtn{background:#242B27;border:1px solid var(--rule);border-radius:11px}
  .row{gap:8px}.fld{flex:1 1 0;min-width:0}.fld.grow{flex:1.25 1 0}
  input{height:56px;border-radius:11px;background:#0E1210;border-color:#303834}

const today=()=>{const d=new Date();
  return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
const dayDiff=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);

   Start on a Thursday and that Thursday is D1. */
const anchor=()=>{ if(!DB.cycleAnchor)DB.cycleAnchor=today(); return DB.cycleAnchor };

/* ================= ACTIVE PLAN ================= */
let PLAN, BW, STD, QMAP, ALL;
const items=d=>PLAN[d].blocks.flatMap(b=>b.items);
const round5=v=>Math.max(0,Math.round(v/5)*5);

/* Generate a plan for a profile that has no bespoke one, from bodyweight × experience. */
function genPlan(bw,exp){
  const e=EXP[exp]||EXP.trained, out={};
  [1,2,3].forEach(d=>{
    const src=PLAN_NR[d];
    out[d]={name:src.name,short:src.short,blocks:src.blocks.map(b=>({t:b.t,items:b.items.map(ex=>{
      const o={...ex};
      if(!ex.bw){
        let w=round5((ex.frac||0)*bw*e.f);
        if(ex.bar && w<ex.bar) w=ex.bar;       // never prescribe below the empty bar
        o.w=w;
      }
      if(ex.inc) o.inc = e.inc==null ? ex.inc : e.inc;
      return o;
    })}))};
  });
  return out;
}
function planFor(p){
  if(p.plan==='nr')return PLAN_NR;
  if(p.plan==='sa')return PLAN_SA;
  return genPlan(p.bw,p.exp);
}
function stdFor(p){
  const frac = p.plan==='sa' ? STD_FRAC_SA : STD_FRAC_NR;
  const out={}; Object.keys(frac).forEach(k=>out[k]=frac[k]*p.bw); return out;
}
/* Derive a load for anything that is not part of a bespoke plan
   (alternates, focus additions, injury substitutes). */
function deriveW(spec){
  if(spec.bw)return 0;
  const e=EXP[profile.exp]||EXP.trained;
  let w=round5((spec.frac||0)*profile.bw*e.f);
  if(spec.bar && w<spec.bar)w=spec.bar;
  return w;
}
function mkEx(spec){
  const e=EXP[profile.exp]||EXP.trained, o={...spec};
  o.w=deriveW(spec);
  if(spec.inc)o.inc = e.inc==null ? spec.inc : e.inc;
  return o;
}
function clonePlan(p){
  const out={};
  [1,2,3].forEach(d=>{out[d]={name:p[d].name,short:p[d].short,
    blocks:p[d].blocks.map(b=>({t:b.t,items:b.items.map(x=>({...x}))}))}});
  return out;
}
function findByMatch(plan,match){
  const m=(match||'').toLowerCase(); if(!m)return null;
  for(const d of [1,2,3])for(const b of plan[d].blocks)
    for(const x of b.items) if(x.n.toLowerCase().includes(m))return {d,b,x};
  return null;
}
function appendEx(plan,spec){
  const found=findByMatch(plan,spec.match);
  if(found){
    /* already in the plan — promote it to the primary block rather than duplicating it,
       so an emphasis movement stops being an afterthought at the end of the session */
    if(spec.primary && found.d===spec.day){
      const bs=plan[spec.day].blocks, dest=bs.find(b=>b.t===spec.block);
      if(dest && dest!==found.b){
        found.b.items=found.b.items.filter(i=>i!==found.x);
        found.x.key=1; dest.items.push(found.x);
      }
    }
    return false;
  }
  const bs=plan[spec.day].blocks;
  (bs.find(b=>b.t===spec.block)||bs[bs.length-1]).items.push(mkEx(spec.ex));
  return true;
}
/* Emphasis = two extra sets on the priority pattern. Core is sets-only and stays
   at the front, one exercise per day rather than inflating every core movement. */
function applyBump(plan,area){
  if(area==='core'){
    [1,2,3].forEach(d=>{
      for(const b of plan[d].blocks){
        const x=b.items.find(i=>(metaOf(i.id).p||[]).includes('core'));
        if(x){x.sets=5;break}
      }
    });
    return;
  }
  const f=FOCUS[area]; let target=null;
  if(f&&f.bump)[1,2,3].forEach(d=>plan[d].blocks.forEach(b=>b.items.forEach(x=>{
    if(CONCEPT_OF[x.id]===f.bump)target=x })));
  if(!target){
    const hits=[];
    [1,2,3].forEach(d=>plan[d].blocks.forEach(b=>b.items.forEach(x=>{
      if((metaOf(x.id).p||[]).includes(area))hits.push(x)})));
    target=hits[hits.length-1];
  }
  if(target)target.sets=(target.sets||3)+2;
}
function idsForInjury(key,plan){
  const def=INJURIES[key]; if(!def)return[];
  const out=[];
  [1,2,3].forEach(d=>plan[d].blocks.forEach(b=>b.items.forEach(x=>{
    if((metaOf(x.id).load||[]).some(l=>def.loads.includes(l)))out.push(x.id)})));
  return [...new Set(out)];
}
const injuredIds=()=>{const s=new Set();
  (DB.injuries||[]).forEach(i=>(i.ids||[]).forEach(id=>s.add(id)));return s};

let ALT_OF={};
function setActivePlan(){
  BW   = profile.bw;
  STD  = stdFor(profile);
  QMAP = profile.plan==='sa' ? QMAP_SA : QMAP_NR;
  const base=clonePlan(planFor(profile));

  /* injury substitutes first, so emphasis can still bump one if it wants to */
  (DB.injuries||[]).forEach(i=>{
    const def=INJURIES[i.key]; if(def)def.subs.forEach(s=>appendEx(base,s));
  });
  const f=DB.focus&&FOCUS[DB.focus];
  if(f){ f.add.forEach(s=>appendEx(base,s)); applyBump(base,DB.focus); }

  const inj=injuredIds();
  [1,2,3].forEach(d=>base[d].blocks.forEach(b=>b.items.forEach(x=>{
    if(inj.has(x.id))x.injured=1})));
  PLAN=base;

  /* ALL carries the alternates too, so a swapped lift resolves in history,
     progression and the session summary exactly like a planned one. */
  const list=[1,2,3].flatMap(d=>items(d));
  const alts=[];
  list.forEach(x=>(metaOf(x.id).alts||[]).forEach(a=>{
    if(!alts.some(y=>y.id===a.id))alts.push(mkEx({...a,r:x.r}))}));
  ALL=list.concat(alts);
  ALT_OF={};
  list.forEach(x=>{ALT_OF[x.id]=(metaOf(x.id).alts||[])
    .map(a=>alts.find(y=>y.id===a.id)).filter(Boolean)});
}

/* ================= VOLUME ACCOUNTING ================= */
function weekDays(){ return [1,2,3]; }
/* Weekly sets per area. Injured exercises count as zero — that is the whole point:
   a hold nobody notices is a hole in the week, not a lift that is merely frozen. */
function setsForPlan(planObj,skip){
  const inj=injuredIds(), acc={}; AREAS.forEach(a=>acc[a]=0);
  weekDays().forEach(d=>planObj[d].blocks.forEach(b=>b.items.forEach(ex=>{
    if((skip&&skip.has(ex.id))||inj.has(ex.id))return;
    const m=metaOf(ex.id), n=ex.sets||3;
    (m.p||[]).forEach(a=>{if(acc[a]!=null)acc[a]+=n});
    (m.s||[]).forEach(a=>{if(acc[a]!=null)acc[a]+=n/2});
  })));
  return acc;
}
const weeklySets=extraSkip=>setsForPlan(PLAN,new Set(extraSkip||[]));
/* the week as it would be with NO emphasis applied — what the diagnosis reports */
function baselineSets(){
  const base=clonePlan(planFor(profile));
  (DB.injuries||[]).forEach(i=>{const def=INJURIES[i.key]; if(def)def.subs.forEach(sp=>appendEx(base,sp))});
  return setsForPlan(base,null);
}
function patternsLost(ids){
  const skip=new Set(ids||[]), inj=injuredIds(), all={}, live={};
  weekDays().forEach(d=>PLAN[d].blocks.forEach(b=>b.items.forEach(ex=>{
    const p=metaOf(ex.id).pat; if(!p)return;
    all[p]=(all[p]||0)+1;
    if(!skip.has(ex.id)&&!inj.has(ex.id))live[p]=(live[p]||0)+1;
  })));
  return Object.keys(all).filter(p=>!live[p]);
}
const fmtSets=v=>Number.isInteger(v)?String(v):v.toFixed(1);
/* What a hold would cost, stated before it is applied. */
function costOf(ids){
  const before=weeklySets([]), after=weeklySets(ids);
  const drops=AREAS.filter(a=>after[a]<before[a]-.01)
    .map(a=>({area:a,from:before[a],to:after[a]}))
    .sort((x,y)=>(x.to-x.from)-(y.to-y.from));
  return {drops, lost:patternsLost(ids)};
}
function costHTML(key,ids){

/* ================= ACCENT ================= */
const INK=[15,21,24], BLACK=[0,0,0], WHITE=[255,255,255];
function hex2rgb(h){h=(h||'#43A177').replace('#','');
  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0]}
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb2hex=r=>'#'+r.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
function applyAccent(){
  const c=hex2rgb(profile&&profile.accent), s=document.body.style;
  s.setProperty('--accent', rgb2hex(c));
  s.setProperty('--accentText', rgb2hex(mix(c,BLACK,.88)));
  s.setProperty('--accentDim', rgb2hex(mix(c,INK,.78)));
  s.setProperty('--accentBright', rgb2hex(mix(c,WHITE,.35)));
  s.setProperty('--accentBorder', rgb2hex(mix(c,INK,.55)));
  s.setProperty('--accentGradA', rgb2hex(mix(c,INK,.86)));
  s.setProperty('--accentGlow', `rgba(${c[0]},${c[1]},${c[2]},.2)`);
}

const wOf=ex=>DB.next[ex.id]!=null?DB.next[ex.id]:ex.w;
const lastOf=id=>{for(let i=DB.history.length-1;i>=0;i--){const e=DB.history[i].entries[id];
  if(e)return{...e,date:DB.history[i].date}}return null};
const toast=m=>{if(!m)return;const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(t._x);t._x=setTimeout(()=>{t.classList.remove('show');t.textContent=''},2800)};

const eff=(ex,w)=>(w==null?wOf(ex):w)*(ex.mult||1);
function badge(ex,raw){
  const s=STD[ex.id];
  if(!s)return `<span class="badge b0" title="No cross-gym standard — just progress it">TRACK</span>`;
  const e=eff(ex,raw), p=e/s, tip=`${e} lb effective of ~${Math.round(s)} lb target`;
  if(p>=.90)return `<span class="badge b4" title="${tip}">OPTIMAL</span>`;
  if(p>=.70)return `<span class="badge b3" title="${tip}">CLOSE</span>`;
  if(p>=.45)return `<span class="badge b2" title="${tip}">BUILDING</span>`;
  return `<span class="badge b1" title="${tip}">NEEDS BOOST</span>`;
}
const PLATES=[45,35,25,10,5,2.5];
function plateLine(ex,total){
  if(!ex.bar)return'';
  const bt=ex.bar===45?'45 lb bar':ex.bar+' lb EZ bar';
  if(total<ex.bar)return `<span class="warn">below the bar (${bt})</span>`;
  if(total===ex.bar)return `<span class="bar45">${bt} only</span>`;
  let side=(total-ex.bar)/2,out=[];
  PLATES.forEach(p=>{while(side>=p-.001){out.push(p);side=+(side-p).toFixed(2)}});
  return `<span class="bar45">${bt} +</span> ${out.map(p=>`<span class="pl">${p}</span>`).join(' ')}`
    +` <span class="bar45">per side</span>`+(side>.001?` <span class="warn">+${side} short</span>`:'');
}
function loEnergyW(ex,w){
  if(!w)return 0;
  return Math.max(0, Math.floor((w*0.85)/5)*5);
}
const ytURL=ex=>`https://www.youtube.com/results?search_query=${encodeURIComponent(QMAP[ex.id]||ex.n+' proper form')}`;
const vid=ex=>`<button class="vid" data-yt="${ex.id}" title="Form video" aria-label="Form video"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>`;
function openVid(ex){
  const u=ytURL(ex); let w=null;
  try{w=window.open(u,'_blank','noopener')}catch(e){}
  if(w)return;

}

/* ================= REST-DAY GATE =================
   Only strength sessions are logged, so this gate sees the whole picture. */
function gate(){
  const last=DB.history[DB.history.length-1];
  if(!last)return{ok:1,msg:"First session. Nothing logged yet."};
  const gap=dayDiff(last.date,today());
  if(gap===0)return{ok:0,hard:0,msg:`You already trained <b>${PLAN[last.day].name}</b> today. Two sessions in one day is not more progress, it is less recovery — only override to catch up a missed log.`};
  if(gap===1)return{ok:0,hard:0,msg:`You trained <b>${PLAN[last.day].name}</b> yesterday. At 3 days a week the plan wants a rest day in between.`};
  return{ok:1,msg:`Last strength session: <b>${PLAN[last.day].name}</b>, ${gap} days ago.`};
}
function nextDay(){
  const last=DB.history[DB.history.length-1];
  return last?(last.day%3)+1:1;
}
function cycleDone(){
  let set=new Set();
  DB.history.forEach(h=>{ set.add(h.day); if(set.size===3) set=new Set(); });
  return set;
}
/* Menstrual-cycle day — logged only, never used to alter any prescription. */
function cycleDayNum(){
  if(!DB.cycleStarts||!DB.cycleStarts.length)return null;
  const last=[...DB.cycleStarts].sort().slice(-1)[0];
  return dayDiff(last,today())+1;
}

function sessionItems(day,lowEnergy){
  return PLAN[day].blocks.filter(b=>!(lowEnergy&&b.t==='Isolation')).flatMap(b=>b.items);
}
function recentStreak(){
  if(!DB.history.length)return 0;
  const dates=[...new Set(DB.history.map(h=>h.date))].sort().reverse();
  let streak=1;
  for(let i=1;i<dates.length;i++){
    const gap=dayDiff(dates[i],dates[i-1]);
    if(gap<=4)streak++;else break;
  }
  return streak;
}
function movementGlyph(ex){
  const p=metaOf(ex.id).pat||'';
  return ({'push-h':'→','push-v':'↑','pull-h':'←','pull-v':'↓',squat:'↕',hinge:'◇',
    core:'◎','anti-ext':'◎','anti-rot':'↻','anti-lat':'◐',iso:'•'})[p]||'•';
}
function completionBox(){
  const c=celebration;
  return `<div class="complete-card">
    <div class="complete-mark">✓</div><div class="eyebrow">Workout complete</div>
    <h2>${c.name} — done.</h2><p>${c.ups?`${c.ups} lift${c.ups===1?'':'s'} earned a heavier target next time.`:'Consistency banked. The next session is ready when you are.'}</p>
    <div class="complete-grid"><div><b>${c.exercises}</b><small>EXERCISES</small></div>
      <div><b>${c.volume.toLocaleString()}</b><small>LB VOLUME</small></div><div><b>${c.minutes}</b><small>MINUTES</small></div></div>
    <button class="big" id="celebrateDone">SEE WHAT'S NEXT</button></div>`;
}

function card(ex,orig){
  orig=orig||ex;
  const A=DB.active, live=A&&A.day===view;
  const entry=live?A.entries[ex.id]:null;
  const lowE = !!(live && A.lowEnergy);
  const swapped = live && A.swaps && A.swaps[orig.id];
  const el=document.createElement('div');
  el.className='ex'+(ex.key||orig.key?' key':'')+(entry?' done':'')+(live?'':' idle')+(orig.injured?' inj':'');
  const w=entry?entry.w:(lowE?loEnergyW(ex,wOf(ex)):wOf(ex));
  const setCount = lowE?2:(orig.sets||3);
  const alts = ALT_OF[orig.id]||[];
  const altBtn = alts.length
    ? `<button class="altbtn ${altOpen===orig.id?'on':''}" data-alt="${orig.id}" title="Alternate exercises">ALT</button>`
    : '';
  const altList = (altOpen===orig.id)?`<div class="altlist">
      <button class="${!swapped?'cur':''}" data-swap="${orig.id}" data-to="">${orig.n}</button>
      ${alts.map(a=>`<button class="${swapped===a.id?'cur':''}" data-swap="${orig.id}" data-to="${a.id}">${a.n}</button>`).join('')}
    </div>`:'';
  const prev=lastOf(ex.id);
  const aim=`<div class="lift-aim"><span>${prev?`LAST <strong>${prev.w||'BW'} × ${prev.reps.join('/')}</strong>`:'FIRST SESSION'}</span>
    <span class="arrow">→</span><span>TODAY <strong>${w||'BW'} × ${ex.r}</strong></span></div>`;
  el.innerHTML=`
   <div class="top"><h3><span class="moveicon">${movementGlyph(ex)}</span><span class="liftname">${ex.n}</span>${badge(ex)}</h3><div class="tgt">${setCount} × ${ex.r}</div>${altBtn}${vid(ex)}</div>
   ${altList}
   ${swapped?`<div class="ft"><span class="swapped">SWAPPED FOR THIS SESSION · logs to its own history</span></div>`:''}
   ${aim}
   <div class="row">
     <div class="fld"><label>${ex.bw?'ADDED LB':(ex.mult?'LB PINNED':(ex.plates?'LB PLATES':'LB'+(ex.each?' EACH':'')))}</label>
       <input type="number" inputmode="decimal" id="w_${ex.id}" value="${w||''}" ${live?'':'disabled'}></div>
     ${Array.from({length:setCount},(_,i)=>`<div class="fld grow"><label>SET ${i+1}</label>
       <input type="number" inputmode="numeric" data-s="${ex.id}" data-i="${i}"
         value="${entry&&entry.reps[i]!=null?entry.reps[i]:''}" ${live?'':'disabled'}></div>`).join('')}
     <button class="log ${live?(entry?'saved':''):'off'}" data-log="${ex.id}">${entry?'✓':'LOG'}</button>
   </div>
   ${ex.bar?`<div class="plates" id="pl_${ex.id}">${plateLine(ex,w)}</div>`:''}
   ${ex.mult?`<div class="plates" id="mu_${ex.id}"><span class="bar45">dual cable ·</span> <span class="pl">${w*ex.mult} lb</span> <span class="bar45">actually moving</span></div>`:''}
   <div class="ft">${foot(ex)}</div>
   <button type="button" class="expand-hit" data-expand="${orig.id}" aria-label="Open ${orig.n}"></button>`;

  const wIn=el.querySelector('#w_'+ex.id);
  wIn.addEventListener('input',()=>{
    const box=el.querySelector('#pl_'+ex.id);
    if(box)box.innerHTML=plateLine(ex,+(wIn.value||0));
    const mu=el.querySelector('#mu_'+ex.id);
    if(mu)mu.innerHTML=`<span class="bar45">dual cable ·</span> <span class="pl">${(+(wIn.value||0))*ex.mult} lb</span> <span class="bar45">actually moving</span>`;
    const oldBadge=el.querySelector('.top h3 .badge');
    if(oldBadge)oldBadge.outerHTML=badgeLive(ex,+(wIn.value||0));
  });
  el.querySelectorAll('[data-s]').forEach(inp=>{
    const t=ex.r;
    const mk=()=>{inp.classList.remove('hit','miss');
      if(inp.value!=='')inp.classList.add(+inp.value>=t?'hit':'miss')};
    mk();inp.addEventListener('input',mk);
  });
  el.querySelector('[data-yt]').addEventListener('click',e=>{e.preventDefault();openVid(ex)});
  const rel=el.querySelector('[data-rel]');
  if(rel)rel.addEventListener('click',()=>{
    if(!confirm(`Release the injury hold on ${ex.n}? Progression starts again next time you close a session.`))return;
    delete DB.holds[ex.id];save();render();toast(`${ex.n} back on progression`);
  });
  const ab=el.querySelector('[data-alt]');
  if(ab)ab.addEventListener('click',()=>{
    altOpen = altOpen===orig.id ? null : orig.id; render();
  });
  el.querySelectorAll('[data-swap]').forEach(b=>b.addEventListener('click',()=>{
    if(!(DB.active&&DB.active.day===view)){toast('Start the session first');return}

    if(to) DB.active.swaps[orig.id]=to; else delete DB.active.swaps[orig.id];

  }));
  el.querySelector('[data-log]').addEventListener('click',()=>logEx(ex,orig));

    render();
    requestAnimationFrame(()=>{
      const opened=document.querySelector(`.ex[data-exercise="${orig.id}"]`);
      if(opened)opened.scrollIntoView({behavior:'smooth',block:'center'});
    });
  });
  el.dataset.exercise=orig.id;
  return el;
}
function badgeLive(ex,w){const s=STD[ex.id];if(!s)return badge(ex);
  const p=eff(ex,w)/s;if(p>=.90)return `<span class="badge b4">OPTIMAL</span>`;
  if(p>=.70)return `<span class="badge b3">CLOSE</span>`;
  if(p>=.45)return `<span class="badge b2">BUILDING</span>`;
  return `<span class="badge b1">NEEDS BOOST</span>`}

function foot(ex){
  const held=DB.holds&&DB.holds[ex.id], flagged=injuredIds().has(ex.id);
  /* an exercise held by an injury FLAG is released from the flag, not one lift at a time */
  const holdUI=flagged
    ? `<span class="hold">INJURY · not counted in weekly volume</span>`
    : (held?`<span class="hold">HOLD · injury, weight frozen</span>
        <button class="release" data-rel="${ex.id}">RELEASE</button>`:'');
  const l=lastOf(ex.id);if(!l)return holdUI+`<span class="pill">no history yet</span>`;
  /* a 2-set low-energy entry never earns the up-arrow, since progression was frozen */
  const hit=l.reps.length>=3&&l.reps.every(r=>r>=ex.r);
  return holdUI+`<span class="pill">last ${l.date.slice(5)} · ${l.w||'BW'} × ${l.reps.join('/')}</span>`
   +(held?'':(hit?`<span class="pill up">↑ now ${wOf(ex)} lb</span>`
        :`<span class="pill hold">hold ${wOf(ex)} until ${ex.sets||3} × ${ex.r}</span>`));
}

    const dropTxt=(c.drops&&c.drops.length)
      ? c.drops.slice(0,3).map(d=>`${d.area} ${fmtSets(d.from)} → <b>${fmtSets(d.to)}</b>`).join(', ')+' sets/week.'
      : 'No area lost volume.';
    return `<div class="cost"><b>${def.label}</b> · flagged ${age} day${age===1?'':'s'} ago, holding ${i.ids.length} exercise${i.ids.length===1?'':'s'}.<br><br>
      ${lostTxt}${dropTxt}<br><br>${def.why}
      <div class="ebtns"><button class="mini del" data-injrel="${i.key}">RELEASE ${def.label}</button></div></div>`;
  }).join('');
  return `<div class="setup">
    <div class="st" style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
      <b style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.13em">INJURY</b></div>
    <p style="font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:4px">
      Flag what hurts. The app works out which exercises it rules out, what that costs you in weekly sets, and what to do instead.</p>
    <div class="fsel">${btns}</div>

}
function nagHTML(){
  const old=(DB.injuries||[]).filter(i=>dayDiff(i.snooze||i.since,today())>=NAG_DAYS);
  if(!old.length)return '';
  return old.map(i=>{
    const def=INJURIES[i.key]; if(!def)return '';
    const age=dayDiff(i.since,today());
    return `<div class="nag">You flagged <b>${def.label}</b> ${age} days ago and it is still holding
      ${i.ids.length} exercise${i.ids.length===1?'':'s'}. A hold nobody lifts becomes permanent by accident — is it still needed?
      <div class="ebtns"><button class="mini" data-nagkeep="${i.key}">STILL NEEDED</button>
      <button class="mini del" data-injrel="${i.key}">RELEASE IT</button></div></div>`;
  }).join('');
}
function applyInjury(key){
  if(!INJURIES[key]||(DB.injuries||[]).some(i=>i.key===key))return;
  const ids=idsForInjury(key,PLAN);
  const c=costOf(ids);                     // measured while they still count as trained
  const added=ids.filter(id=>!DB.holds[id]);   // never clobber a pre-existing manual hold
  DB.injuries=DB.injuries||[];
  DB.injuries.push({key,since:today(),ids,added,cost:c});
  ids.forEach(id=>{DB.holds[id]=1});
  setActivePlan(); save(); render();
  toast(ids.length?`${INJURIES[key].label} flagged · ${ids.length} exercise${ids.length===1?'':'s'} held`
                 : `${INJURIES[key].label} flagged · nothing in your week loads that`);
}
function releaseInjury(key){
  const rec=(DB.injuries||[]).find(i=>i.key===key); if(!rec)return;
  DB.injuries=(DB.injuries||[]).filter(i=>i.key!==key);
  const still=injuredIds();
  (rec.added||rec.ids||[]).forEach(id=>{ if(!still.has(id)) delete DB.holds[id]; });
  setActivePlan(); save(); render();
  toast(`${INJURIES[key].label} released · progression resumes`);
}

    else { preLowEnergy=!preLowEnergy; render(); }
  });
  const cb=document.getElementById('cycleBtn');
  if(cb)cb.addEventListener('click',()=>{

  });

function begin(){
  celebration=null;
  focusedExId=null;
  DB.active={day:view,date:today(),started:Date.now(),entries:{},lowEnergy:preLowEnergy};
  preLowEnergy=false;
  save();render();toast(`${PLAN[view].name} started`);
}
function logEx(ex,orig){
  if(!(DB.active&&DB.active.day===view)){toast('Start the session first');return}
  const A=DB.active, setCount=A.lowEnergy?2:((orig||ex).sets||3);
  const reps=[...Array(setCount).keys()].map(i=>document.querySelector(`[data-s="${ex.id}"][data-i="${i}"]`).value)
    .map(v=>v===''?null:+v);
  if(reps.some(r=>r==null)){toast(`Fill all ${setCount} sets`);return}
  const w=+(document.getElementById('w_'+ex.id).value||0);
  DB.active.entries[ex.id]={w,reps};      // overwrite, never compounds
  focusedExId=null;
  save();render();
  toast(`${ex.n} saved — tap LOG again to correct it`);
}
function reopen(){
  const last=DB.history[DB.history.length-1];
  if(!last||last.date!==today()){toast('Nothing to reopen');return}
  DB.history.pop();
  Object.entries(last.entries).forEach(([id,e])=>{DB.next[id]=e.w});
  DB.active={day:last.day,date:last.date,started:Date.now(),entries:last.entries,lowEnergy:!!last.lowEnergy};
  focusedExId=null;
  view=last.day;save();render();window.scrollTo({top:0});
  toast(`${PLAN[last.day].name} reopened — finish and close it again`);
}
function endSession(){
  const A=DB.active, ids=Object.keys(A.entries);
  if(!ids.length){toast('Nothing logged yet');return}
  let ups=[];
  ids.forEach(id=>{
    const ex=exById(id), e=A.entries[id];
    if(!ex)return;
    const hit=e.reps.length>0&&e.reps.every(r=>r>=ex.r);
    const held=(DB.holds&&DB.holds[id])||A.lowEnergy;   // low-energy freezes progression, same as a hold
    DB.next[id]=(hit&&ex.inc&&!held)?e.w+ex.inc:e.w;    // applied ONCE, here
    if(hit&&ex.inc&&!held)ups.push(ex.n);
  });
  let vol=0;ids.forEach(id=>{vol+=volOf(id,A.entries[id].w,A.entries[id].reps)});
  DB.history.push({date:A.date,day:A.day,vol,entries:A.entries,
    lowEnergy:!!A.lowEnergy, cycleDay: profile.cycle?cycleDayNum():undefined});
  celebration={name:PLAN[A.day].name,exercises:ids.length,volume:Math.round(vol),ups:ups.length,
    minutes:Math.max(1,Math.round((Date.now()-(A.started||Date.now()))/60000))};
  DB.active=null;save();render();
  toast(A.lowEnergy?'Session closed · low energy day, no progression'
    :(ups.length?`Session closed · ${ups.length} lift${ups.length>1?'s':''} moved up`:'Session closed'));
}

function diag(){
  let ls="?";
  try{ localStorage.setItem("liftlog:probe","1");
       ls = localStorage.getItem("liftlog:probe")==="1" ? "writable" : "read-back failed";
       localStorage.removeItem("liftlog:probe"); }
  catch(e){ ls = "BLOCKED ("+(e.name||"error")+")"; }
  const sz=k=>{try{const v=localStorage.getItem(k);return v?v.length+" chars":"EMPTY"}catch(e){return "?"}};
  const standalone = (window.navigator.standalone===true) ? "home-screen app" :
    (window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches ? "standalone" : "browser tab");
  return `<div class="diag">
    <b>STORAGE CHECK</b><br>
    active profile: ${profile.name} (${profile.initials}) · ${profile.id}<br>
    localStorage: ${ls}<br>
    this profile's record: ${sz(keyFor(profile.id))}<br>
    ${profiles.map(p=>`${p.initials} → ${keyFor(p.id)}: ${sz(keyFor(p.id))}`).join('<br>')}<br>
    legacy liftlog:v2: ${sz(KEY_BASE)}<br>
    legacy liftlog:v2:nr: ${sz(keyFor('nr'))}<br>
    legacy liftlog:v2:sa: ${sz(keyFor('sa'))}<br>
    sessions in memory: ${DB.history.length}<br>
    cycle: D1 anchored ${anchor()} · today is ${DOW[cycleIdx(today())]}<br>
    focus: ${DB.focus||'none'} · injuries: ${(DB.injuries||[]).map(i=>i.key).join(',')||'none'}<br>
    mode: ${standalone}<br>
    origin: ${location.origin}<br>
    window.storage: ${window.storage?"present":"absent"}
  </div>`;
}
function history(){
  if(!DB.history.length)return historySummaryHTML()+`<div class="empty">No strength sessions yet.<br>
    Start a day, log your sets, and end the session — the progression shows up here.</div>`+diag();
  const histIds=[...new Set(DB.history.flatMap(s=>Object.keys(s.entries)))];
  const rowIds=[...new Set(ALL.map(x=>x.id).concat(histIds))];
  const rows=rowIds.map(id=>{
    const ex=exById(id); if(!ex)return null;
    const hits=DB.history.filter(s=>s.entries[ex.id]);
    if(!hits.length)return null;
    const first=hits[0].entries[ex.id].w, now=wOf(ex), std=STD[ex.id];
    const pct=std?Math.min(100,Math.round(now/std*100)):null;
    const vals=hits.slice(-6).map(h=>h.entries[ex.id].w||0), hi=Math.max(1,...vals);
    const spark=`<span class="spark" aria-label="Recent weight trend">${vals.map(v=>`<i style="height:${Math.max(12,Math.round(v/hi*100))}%"></i>`).join('')}</span>`;
    return `<div class="hrow">
      <span class="nm">${ex.n}</span>
      ${spark}
      <span class="delta">${first} → <b>${now}</b>${now>first?` +${now-first}`:''}</span></div>`;
  }).filter(Boolean).join('');
  const ses=[...DB.history].map((s,i)=>({s,i})).reverse().map(({s,i})=>{
    if(editIdx===i){
      const fields=Object.keys(s.entries).map(id=>{
        const ex=exById(id)||{n:id}, en=s.entries[id];
        return `<div class="erow"><span class="en">${ex.n}</span>
          <input class="ei w" data-i="${i}" data-id="${id}" data-f="w" type="number" inputmode="numeric" value="${en.w}">
          ${en.reps.map((_,k)=>`<input class="ei r" data-i="${i}" data-id="${id}" data-f="${k}" type="number" inputmode="numeric" value="${en.reps[k]!=null?en.reps[k]:''}">`).join('')}
        </div>`;}).join('');
      return `<div class="sesedit">
        <div class="erow head"><span class="en">${PLAN[s.day].name}</span><span>LB</span><span>S1</span><span>S2</span><span>S3</span></div>
        ${fields}
        <div class="erow"><span class="en">Date</span>
          <input class="ei date" data-i="${i}" data-f="date" type="date" value="${s.date}"></div>
        <div class="ebtns"><button class="mini" data-edone="1">DONE</button>
          <button class="mini del" data-edel="${i}">DELETE SESSION</button></div></div>`;
    }
    const cycleTxt = (profile.cycle&&s.cycleDay!=null)?` · cycle day ${s.cycleDay}`:'';
    const loweTxt = s.lowEnergy?' · LOW ENERGY':'';
    return `<div class="sesrow">
      <span class="d">${s.date.slice(5)}</span>
      <span class="t">${PLAN[s.day].name} · ${Object.keys(s.entries).length} exercises${cycleTxt}${loweTxt}</span>
      <span class="v">${s.vol.toLocaleString()} lb</span>
      <button class="mini" data-edit="${i}">EDIT</button></div>`;}).join('');
  return historySummaryHTML()+`<div class="h2">Weight progression</div><div class="hcard">${rows}</div>
    <div class="h2">Sessions · ${DB.history.length}</div><div class="hcard">${ses}</div>`+diag();
}

function historySummaryHTML(){
  const total=DB.history.reduce((a,s)=>a+(s.vol||0),0);
  const month=DB.history.filter(s=>dayDiff(s.date,today())<=30).length;
  const ids=[...new Set(DB.history.flatMap(s=>Object.keys(s.entries)))];
  let prs=0;ids.forEach(id=>{const vals=DB.history.filter(s=>s.entries[id]).map(s=>s.entries[id].w||0);if(vals.length>1&&vals[vals.length-1]>vals[0])prs++});
  return `<div class="history-summary"><div><b>${month}</b><small>SESSIONS / 30D</small></div>
    <div><b>${Math.round(total/1000)}K</b><small>LIFETIME VOLUME</small></div><div><b>${prs}</b><small>LIFTS IMPROVED</small></div></div>`;
}

function recalcVol(sess){
  let v=0; Object.keys(sess.entries).forEach(id=>{v+=volOf(id,sess.entries[id].w,sess.entries[id].reps)});
  sess.vol=Math.round(v);
}

document.getElementById('list').addEventListener('change',ev=>{
  const t=ev.target; if(!t.classList||!t.classList.contains('ei'))return;
  const sess=DB.history[+t.dataset.i]; if(!sess)return;
  if(t.dataset.f==='date'){ if(t.value)sess.date=t.value; }
  else if(t.dataset.f==='w'){ sess.entries[t.dataset.id].w=+t.value||0; }
  else { const r=t.value===''?null:+t.value; sess.entries[t.dataset.id].reps[+t.dataset.f]=r; }
  recalcVol(sess);
  DB.history.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  save();
});

function closeSwitcher(){ const sw=document.getElementById('switcher'); if(sw)sw.hidden=true; }

async function loadDBFor(id,planKey){
  let raw=null; try{ raw=await store.get(keyFor(id)); }catch(e){}
  if(raw){
    try{
      const p=JSON.parse(raw);
      return { next:p.next||{}, history:p.history||[], active:p.active||null,
               holds:p.holds||{}, cycleStarts:p.cycleStarts||[],
               focus:p.focus||null, injuries:p.injuries||[],
               cycleAnchor:p.cycleAnchor||null };
    }catch(e){}
  }
  return defaultDB(planKey);
}
/* Order matters: flush the current profile BEFORE repointing anything at the new one. */
async function activateProfile(id){
  const p=profiles.find(x=>x.id===id); if(!p)return;
  if(profile && profile.id!==id) await save();     // flush outgoing profile to ITS key
  profile=p;
  try{ await store.set(ACTIVE_KEY, profile.id); }catch(e){}
  DB=await loadDBFor(profile.id, profile.plan);
  setActivePlan();
  editIdx=null; preLowEnergy=false; storageOK=null; altOpen=null;
  setViewFromSlot();
  render();
}
async function switchProfile(id){
  if(!profile || id===profile.id){ closeSwitcher(); return; }
  await activateProfile(id);
  closeSwitcher();
  toast(`Switched to ${profile.name}`);
}

      if(!p||typeof p!=='object')throw 0;
      // accept: matching profile id, or a legacy 'nr'/'sa' export whose tag matches this plan
      const legacyOK = (p.profile==='nr'||p.profile==='sa') && p.profile===profile.plan;
      const ok = !p.profile || p.profile===profile.id || legacyOK;
      if(!ok){
        toast(`That export belongs to ${p.profileName||p.profile} — switch profile first`);
        return;
      }
      DB.next=p.next||{};DB.history=p.history||[];DB.active=p.active||null;DB.holds=p.holds||{};
      DB.cycleStarts=p.cycleStarts||[];
      DB.focus=p.focus||null; DB.injuries=p.injuries||[];
      DB.cycleAnchor=p.cycleAnchor||null;
      setActivePlan();
      save();render();toast(`Imported ${DB.history.length} session${DB.history.length===1?'':'s'}`);
    }catch(e){toast('That file is not a valid export')}
  };
  rd.readAsText(f);ev.target.value='';
});
document.getElementById('wipe').addEventListener('click',()=>{
  if(!confirm(`Erase all history, progression and the open session for ${profile.name}? Other profiles are untouched.`))return;
  DB=defaultDB(profile.plan); DB.holds={};   // a manual reset clears seeded holds too
  save();render();toast('Cleared');
});

/* iOS can leave the layout viewport scrolled to the bottom when the number
   keyboard closes. Re-anchor the field the user just finished, but do not
   interfere when they move directly into another input. */
let fieldFocusTimer=null;
document.addEventListener('focusout',e=>{
  const field=e.target;
  if(!field.matches||!field.matches('input[type="number"]'))return;
  clearTimeout(fieldFocusTimer);
  fieldFocusTimer=setTimeout(()=>{
    if(document.activeElement&&document.activeElement.matches('input,select,textarea'))return;
    if(!field.isConnected)return;
    const r=field.getBoundingClientRect();
    const sticky=document.querySelector('.sess.live');
    const visibleTop=sticky?sticky.getBoundingClientRect().bottom+12:12;
    const visibleBottom=(window.visualViewport?window.visualViewport.height:window.innerHeight)-24;
    if(r.top<visibleTop||r.bottom>visibleBottom)
      field.scrollIntoView({behavior:'auto',block:'center',inline:'nearest'});
  },450);
});

/* ================= BOOT ================= */
(async()=>{
  /* 1. legacy single-key record -> :nr  (kept from the previous version, non-destructive) */
  try{
    const old = await store.get(KEY_BASE);
    const nrExisting = await store.get(keyFor('nr'));
    if(old && !nrExisting) await store.set(keyFor('nr'), old);
  }catch(e){}

  /* 2. seed the profile registry, copying the two fixed-key records onto generated ids.
        Copy only — liftlog:v2, :nr and :sa are all left in place as backups. */
  let raw=null; try{ raw=await store.get(PROFILES_KEY); }catch(e){}
  if(raw){ try{ profiles=JSON.parse(raw)||[]; }catch(e){ profiles=[]; } }
  if(!Array.isArray(profiles)||!profiles.length){
    const nr={id:newId(),name:"Nicolas",initials:"NR",accent:"#43A177",bw:194,exp:"trained",
              plan:"nr",lowEnergy:false,cycle:false};
    const sa={id:newId(),name:"SA",initials:"SA",accent:"#e58fb0",bw:132,exp:"new",
              plan:"sa",lowEnergy:true,cycle:true};
    profiles=[nr,sa];
    for(const [legacy,p] of [['nr',nr],['sa',sa]]){
      try{
        const src=await store.get(keyFor(legacy));
        if(src && !(await store.get(keyFor(p.id)))) await store.set(keyFor(p.id), src);
      }catch(e){}
    }
    await saveProfiles();
  }

  /* 3. resolve the active profile (legacy values 'nr'/'sa' map onto the seeded ids) */
  let act=null; try{ act=await store.get(ACTIVE_KEY); }catch(e){}
  let chosen=profiles.find(p=>p.id===act)
          || profiles.find(p=>p.plan===act)
          || profiles[0];

  if(dirty){hydrated=true;return}   // user already worked: never clobber
  await activateProfile(chosen.id);
  hydrated=true;
})();
</script>
